name: Bug report
description: Report a CourierPilot capture, parser, UI, or reliability problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not post customer names, phone numbers, exact delivery addresses, or unredacted courier screenshots.**

        For capture/reliability problems, prefer the privacy-safe diagnostics report from CourierPilot's Reliability screen.

  - type: input
    id: version
    attributes:
      label: CourierPilot version
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Realme 14 Pro+ / Android 16"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Courier platform
      options:
        - Wolt
        - Bolt
        - Both
        - Not platform-specific
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Receive an offer
        2. ...
        3. ...

  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Paste the Reliability screen diagnostics report if relevant. Redact anything personal before posting.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed customer names, phone numbers, exact addresses, and other personal information from this report.
          required: true
