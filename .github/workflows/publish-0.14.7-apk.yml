name: Publish CourierPilot 0.14.7 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.14.7-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.14.7
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/courierpilot-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/courierpilot-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Verify release certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EXPECTED_CERT_SHA256="74556417f1289281bcaf1a2c6f3f4aa119db24b079a13759a583c3cc66796b70"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          sha256sum "$APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="CourierPilot-v0.14.7.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view v0.14.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.14.7 "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.14.7 "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CourierPilot 0.14.7" \
              --generate-notes
          fi

      - name: Mark release confirmed
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          printf 'CourierPilot v0.14.7 APK confirmed at %s\n' "$(date -u +%FT%TZ)" > .release-0.14.7-confirmed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-0.14.7-confirmed
          git commit -m 'chore: confirm 0.14.7 release asset'
          git push origin main
