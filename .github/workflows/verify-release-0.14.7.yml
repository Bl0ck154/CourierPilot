name: Verify CourierPilot 0.14.7 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-release-0.14.7.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if gh release view v0.14.7 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'CourierPilot-v0.14.7.apk'; then
              echo 'v0.14.7 APK confirmed'
              printf 'CourierPilot v0.14.7 APK confirmed at %s\n' "$(date -u +%FT%TZ)" > .release-0.14.7-confirmed
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add .release-0.14.7-confirmed
              git commit -m 'chore: confirm 0.14.7 release asset'
              git push origin HEAD:main
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for CourierPilot-v0.14.7.apk' >&2
          exit 1
