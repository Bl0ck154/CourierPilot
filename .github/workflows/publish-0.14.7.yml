name: Publish CourierPilot 0.14.7

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.14.7.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.14.7 tag on the release commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="8b99994c86f78d64e006a902ff014cd03e208660"
          if git ls-remote --exit-code --tags origin refs/tags/v0.14.7 >/dev/null 2>&1; then
            echo "v0.14.7 already exists"
            exit 0
          fi
          git tag v0.14.7 "$TARGET_SHA"
          git push origin refs/tags/v0.14.7
