name: Tag CourierPilot v0.11.4

on:
  push:
    paths:
      - '.github/workflows/tag-v0.11.4.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.11.4 tag on tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="06478e6f4885b4f205c6e918d3852952c177b13e"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.11.4" >/dev/null 2>&1; then
            echo "Tag v0.11.4 already exists"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0.11.4' \
              -f sha="$TARGET_SHA"
          fi

      - name: Dispatch permanent signed release workflow on v0.11.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref v0.11.4
