name: Source export once

on:
  push:
    branches:
      - 'fix/dedupe-address-memory-v0.11.1'
    paths:
      - '.github/workflows/source-export-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: tar -czf /tmp/courierpilot-source.tgz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: courierpilot-source
          path: /tmp/courierpilot-source.tgz
          retention-days: 1
