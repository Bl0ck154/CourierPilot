name: Publish CourierPilot 0.14.4

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish CourierPilot 0.14.4'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 2fbd40ea116588d328b88a02f3f20e25c3f7b02c
      TAG: v0.14.4
      ARTIFACT_RUN_ID: '32014141717'
      ARTIFACT_NAME: courierpilot-release-42

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${TARGET_SHA}^{commit}")" = "$TARGET_SHA"
          git show "$TARGET_SHA:app/build.gradle.kts" | grep -F 'versionName = "0.14.4"'
          git show "$TARGET_SHA:app/build.gradle.kts" | grep -F 'versionCode = 31'

      - name: Download already verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact
          test -f release-artifact/app-release.apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify permanent release certificate again
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          APK="release-artifact/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EXPECTED_CERT_SHA256="74556417f1289281bcaf1a2c6f3f4aa119db24b079a13759a583c3cc66796b70"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          sha256sum "$APK"

      - name: Create release tag at tested commit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "CourierPilot 0.14.4"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NAMED_APK="CourierPilot-${TAG}.apk"
          cp release-artifact/app-release.apk "$NAMED_APK"
          cat > release-notes.md <<'EOF'
          ## CourierPilot 0.14.4

          - Reworked Bolt merchant detection so map labels such as Railway Park or Vilnius do not replace the restaurant name.
          - Normalizes OCR Unicode artifacts before saving merchant names and addresses, including hidden characters in Lithuanian text such as Vokiečių.
          - Rewrote live-offer overlay gestures: drag vertically from the title/body to move it and save the position.
          - Swipe left or right on the title/body to dismiss the current offer card.
          - The overlay now starts visibly lower (48dp) and has 12dp side margins; the old saved Y position is reset once after upgrade.
          - Overlay header shows the installed version and a ↕ drag hint.
          EOF
          gh release create "$TAG" "$NAMED_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CourierPilot 0.14.4" \
            --notes-file release-notes.md
