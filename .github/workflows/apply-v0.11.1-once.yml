name: Apply 0.11.1 patch once

on:
  push:
    branches:
      - 'fix/dedupe-address-memory-v0.11.1'
    paths:
      - '.github/workflows/apply-v0.11.1-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply prepared fix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode courierpilot-fix.patch.gz.b64 | gzip -d > /tmp/courierpilot-fix.patch
          patch -p1 --forward --batch < /tmp/courierpilot-fix.patch
          rm -f courierpilot-fix.patch.gz.b64
          rm -f .github/workflows/source-export-once.yml
          rm -f .github/workflows/apply-v0.11.1-once.yml
          git config user.name 'Bl0ck'
          git config user.email '36800583+Bl0ck154@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'CourierPilot 0.11.1: dedupe offers and normalize address memory'
          git push origin HEAD:fix/dedupe-address-memory-v0.11.1
