name: Tag CourierPilot v0.11.3

on:
  push:
    paths:
      - '.github/workflows/tag-v0.11.3.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.11.3 tag on tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="f3f0282bd6b539e6c58624e2cedcba3e4a21b054"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.11.3" >/dev/null 2>&1; then
            echo "Tag v0.11.3 already exists"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0.11.3' \
              -f sha="$TARGET_SHA"
          fi

      - name: Dispatch permanent signed release workflow on v0.11.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref v0.11.3
