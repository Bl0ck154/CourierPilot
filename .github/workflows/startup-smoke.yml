name: Android startup smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK and emulator image
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name courierpilot-ci --package "system-images;android-35;google_apis;x86_64"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Boot emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          nohup emulator @courierpilot-ci -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
      - name: Install and launch CourierPilot
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK"
          # Avoid the Android 13+ notification permission dialog masking the real launcher path.
          adb shell pm grant com.block154.courierpilot android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          set +e
          adb shell am start -W -n com.block154.courierpilot/.AppUpdateLauncherActivity | tee /tmp/start.txt
          START_RC=${PIPESTATUS[0]}
          set -e

          DASHBOARD_READY=0
          for i in $(seq 1 20); do
            if adb shell dumpsys activity activities | grep -q "com.block154.courierpilot/.CourierPilotDashboardActivity"; then
              DASHBOARD_READY=1
              break
            fi
            sleep 1
          done

          PID="$(adb shell pidof com.block154.courierpilot | tr -d '\r')"
          if [ "$START_RC" -ne 0 ] || [ -z "$PID" ] || [ "$DASHBOARD_READY" -ne 1 ]; then
            echo "CourierPilot failed to reach the dashboard through the real launcher"
            adb shell dumpsys activity activities >&2 || true
            adb logcat -d -v threadtime '*:S' AndroidRuntime:E ActivityTaskManager:E >&2 || true
            exit 1
          fi
          echo "CourierPilot dashboard running as PID $PID"
