<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CourierPilot</title>
  <desc id="desc">CourierPilot — a local-first Android journal for Wolt and Bolt courier offers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="0.55" stop-color="#0d1c29"/>
      <stop offset="1" stop-color="#09131d"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f2b8"/>
      <stop offset="1" stop-color="#32c989"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="36" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="150" fill="#2ad98f" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1030" cy="350" r="190" fill="#4d8dff" opacity="0.07" filter="url(#glow)"/>

  <g transform="translate(70 62)">
    <rect x="0" y="0" width="296" height="296" rx="70" fill="#101e2a" stroke="#334654" stroke-width="4"/>
    <path d="M148 42c-48 0-87 39-87 87 0 64 87 145 87 145s87-81 87-145c0-48-39-87-87-87Z" fill="none" stroke="url(#pin)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M110 125 198 93 167 181l-24-29-28 21Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M48 239h42m28 24h46m31-18 61-18" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="18 15"/>
  </g>

  <g transform="translate(420 92)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="72" fill="#f7fbff" font-size="76" font-weight="800">Courier<tspan fill="#53e09c">Pilot</tspan></text>
    <text x="2" y="122" fill="#aebdcc" font-size="27" font-weight="500">Local-first Android journal for Wolt &amp; Bolt courier offers</text>
    <text x="2" y="171" fill="#dbe6ee" font-size="23">Capture priced offers. Keep the original. Understand your own data.</text>

    <g transform="translate(0 210)" font-size="18" font-weight="650">
      <g><rect width="150" height="44" rx="22" fill="#143226" stroke="#276746"/><text x="21" y="29" fill="#7bf2b8">● Price-gated</text></g>
      <g transform="translate(166 0)"><rect width="145" height="44" rx="22" fill="#17273a" stroke="#315171"/><text x="22" y="29" fill="#a8cdfb">OCR fallback</text></g>
      <g transform="translate(327 0)"><rect width="132" height="44" rx="22" fill="#202338" stroke="#494e7d"/><text x="22" y="29" fill="#c9c8ff">Local data</text></g>
      <g transform="translate(475 0)"><rect width="146" height="44" rx="22" fill="#2d2617" stroke="#6c592c"/><text x="20" y="29" fill="#f5d47c">Android 11+</text></g>
    </g>
  </g>

  <text x="1134" y="390" text-anchor="end" fill="#627687" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">v0.5.1</text>
</svg>
